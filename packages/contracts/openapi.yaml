openapi: 3.1.0
info:
  title: Sprache Account Binding API
  version: 0.2.0
  description: >-
    Stores only an anonymized Google account to Drive folder mapping and
    performs transient desktop OAuth token exchanges without persisting tokens.
servers:
  - url: http://127.0.0.1:3000
paths:
  /health:
    get:
      summary: Inspect service and desktop OAuth broker readiness
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, desktopOAuthBroker]
                properties:
                  status:
                    const: ok
                  service:
                    const: sprache-api
                  desktopOAuthBroker:
                    type: string
                    enum: [ready, not_configured]
  /v1/oauth/google/desktop/token:
    post:
      summary: Exchange a desktop Google OAuth code or refresh token
      operationId: requestDesktopGoogleToken
      description: >-
        Exchanges a loopback PKCE authorization code or refresh token through
        Railway. The API forwards token material to Google and the caller
        without writing it to PostgreSQL or application logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/DesktopAuthorizationCodeRequest"
                - $ref: "#/components/schemas/DesktopRefreshTokenRequest"
              discriminator:
                propertyName: grantType
      responses:
        "200":
          description: Google token response.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopGoogleTokenResponse"
        "400":
          $ref: "#/components/responses/DesktopOAuthError"
        "502":
          $ref: "#/components/responses/DesktopOAuthError"
        "503":
          $ref: "#/components/responses/DesktopOAuthError"
  /v1/auth/verify:
    post:
      summary: Verify a Google identity token
      operationId: verifyAuthentication
      security:
        - googleIdToken: []
      responses:
        "200":
          description: Token is valid.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, driveConnected]
                properties:
                  authenticated:
                    const: true
                  driveConnected:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/drive-root:
    get:
      summary: Read the current account Drive folder binding
      operationId: getDriveRoot
      security:
        - googleIdToken: []
      responses:
        "200":
          description: Current account binding, or null.
          content:
            application/json:
              schema:
                type: object
                required: [binding]
                properties:
                  binding:
                    oneOf:
                      - $ref: "#/components/schemas/DriveBinding"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Save the current account Drive folder binding
      operationId: putDriveRoot
      security:
        - googleIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folderId]
              properties:
                folderId:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{10,256}$"
                folderName:
                  type: [string, "null"]
                  maxLength: 256
                schemaVersion:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        "200":
          description: Binding stored.
          content:
            application/json:
              schema:
                type: object
                required: [binding]
                properties:
                  binding:
                    $ref: "#/components/schemas/DriveBinding"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Delete the current account Drive folder binding
      operationId: deleteDriveRoot
      security:
        - googleIdToken: []
      responses:
        "204":
          description: Binding removed. Drive files are not deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    googleIdToken:
      type: http
      scheme: bearer
      bearerFormat: Google ID Token
  schemas:
    DesktopAuthorizationCodeRequest:
      type: object
      additionalProperties: false
      required: [grantType, authorizationCode, codeVerifier, redirectUri]
      properties:
        grantType:
          const: authorization_code
        authorizationCode:
          type: string
          minLength: 1
          maxLength: 4096
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9\\-._~]+$"
        redirectUri:
          type: string
          pattern: "^http://127\\.0\\.0\\.1:[0-9]{1,5}$"
    DesktopRefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [grantType, refreshToken]
      properties:
        grantType:
          const: refresh_token
        refreshToken:
          type: string
          minLength: 1
          maxLength: 4096
    DesktopGoogleTokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, idToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: [string, "null"]
        idToken:
          type: [string, "null"]
        expiresIn:
          type: integer
          minimum: 1
    DriveBinding:
      type: object
      required:
        [folderId, folderName, schemaVersion, createdAt, updatedAt]
      properties:
        folderId:
          type: string
        folderName:
          type: [string, "null"]
        schemaVersion:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    Unauthorized:
      description: Missing, invalid, or expired Google ID Token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DesktopOAuthError:
      description: Desktop OAuth broker or Google token endpoint error.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  description:
                    type: [string, "null"]
