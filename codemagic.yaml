workflows:
  apple-preview:
    name: Sprache Apple preview artifacts
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: "3.44.8"
      xcode: latest
      cocoapods: default
      vars:
        SPRACHE_VERSION: "1.33.0"
        SPRACHE_BUILD_NUMBER: "57"
        SPRACHE_APPLE_ARTIFACT_DIR: "artifacts/apple-preview"
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Verify Apple build host
        script: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          pod --version
      - name: Build, launch, verify, and package Apple previews
        script: |
          set -euo pipefail
          bash tool/build-apple-preview.sh
    artifacts:
      - artifacts/apple-preview/*.zip
      - artifacts/apple-preview/*.sha256
      - artifacts/apple-preview/runtime-*.json
      - artifacts/apple-preview/runtime-*.png
      - /tmp/xcodebuild_logs/*.log
