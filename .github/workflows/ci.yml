name: CI

on:
  push:
    branches: ["main", "codex/**", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint:api
      - run: npm run test:api
      - run: npm run test:release-bundle
      - run: npm run build:api

  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - working-directory: apps/client
        run: flutter pub get
      - working-directory: apps/client
        run: flutter analyze
      - working-directory: apps/client
        shell: bash
        run: |
          mapfile -t test_files < <(
            find test -type f -name '*_test.dart' \
              ! -path 'test/visual/*' \
              ! -path 'test/qa/release_visual_semantics_matrix_test.dart' \
              ! -path 'test/qa/performance_budget_test.dart' \
              -print
          )
          flutter test "${test_files[@]}"
      - name: Verify large-dataset performance budgets in isolation
        working-directory: apps/client
        run: >-
          flutter test --concurrency=1
          test/qa/performance_budget_test.dart
      - working-directory: apps/client
        run: >-
          flutter build apk --release
          --build-name=1.31.0
          --build-number=55
          --dart-define=ENABLE_MOCK_MODE=true
          --dart-define=APP_VERSION=1.31.0
      - name: Verify Android release output
        working-directory: apps/client
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Package Android CI artifact
        working-directory: apps/client
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/sprache-ci-artifacts"
          artifact_name="Sprache-1.31.0-ci-android-mock.apk"
          mkdir -p "$artifact_dir"
          cp build/app/outputs/flutter-apk/app-release.apk "$artifact_dir/$artifact_name"
          (
            cd "$artifact_dir"
            sha256sum "$artifact_name" > "$artifact_name.sha256"
          )
      - name: Upload Android CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sprache-1.31.0-ci-android-mock
          path: |
            ${{ runner.temp }}/sprache-ci-artifacts/Sprache-1.31.0-ci-android-mock.apk
            ${{ runner.temp }}/sprache-ci-artifacts/Sprache-1.31.0-ci-android-mock.apk.sha256
          if-no-files-found: error
          retention-days: 14

  android-real-runtime:
    name: Android REAL build and emulator runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"
      SPRACHE_VERSION: "1.31.0"
      SPRACHE_BUILD_NUMBER: "55"
      SPRACHE_PACKAGE: com.youkdonghun.sprache
      SPRACHE_API_BASE_URL: https://sprache-api-production.up.railway.app
      SPRACHE_PRIVACY_POLICY_URL: https://sprache-api-production.up.railway.app/privacy
      SPRACHE_GOOGLE_ANDROID_CLIENT_ID: 1054343487948-v3u90fo5nmbrk4hn7ss2gnrg601phkuv.apps.googleusercontent.com
      SPRACHE_GOOGLE_SERVER_CLIENT_ID: 1054343487948-g6b3fp20ooq86agro7nsb129oqr9df82.apps.googleusercontent.com
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Install pinned Android build and emulator packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root" ]]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME does not identify an Android SDK."
            exit 1
          fi
          sdkmanager="$({
            find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print
          } | sort -V | tail -n 1)"
          avdmanager="$({
            find "$sdk_root/cmdline-tools" -type f -path '*/bin/avdmanager' -print
          } | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          test -x "$avdmanager"
          android_avd_home="$RUNNER_TEMP/sprache-android-avd"
          mkdir -p "$android_avd_home"
          echo "ANDROID_AVD_HOME=$android_avd_home" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$android_avd_home"
          "$sdkmanager" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "$ANDROID_SYSTEM_IMAGE"
          echo "no" | "$avdmanager" create avd \
            --force \
            --name SpracheCiApi35 \
            --package "$ANDROID_SYSTEM_IMAGE" \
            --device pixel_6
          {
            echo "hw.keyboard=yes"
            echo "hw.gpu.enabled=yes"
            echo "hw.gpu.mode=swiftshader_indirect"
            echo "showDeviceFrame=no"
          } >> "$ANDROID_AVD_HOME/SpracheCiApi35.avd/config.ini"
          emulator="$sdk_root/emulator/emulator"
          test -x "$emulator"
          "$emulator" -list-avds | grep -Fxq SpracheCiApi35
      - name: Build production-configured REAL APK with debug signing
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          signing_variables=(
            SPRACHE_ANDROID_KEYSTORE_PATH
            SPRACHE_ANDROID_KEYSTORE_PASSWORD
            SPRACHE_ANDROID_KEY_ALIAS
            SPRACHE_ANDROID_KEY_PASSWORD
          )
          for variable in "${signing_variables[@]}"; do
            if [[ -n "${!variable:-}" ]]; then
              echo "::error::$variable is set, so the debug-signed artifact label would be dishonest."
              exit 1
            fi
          done
          flutter pub get
          flutter build apk --release \
            --build-name="$SPRACHE_VERSION" \
            --build-number="$SPRACHE_BUILD_NUMBER" \
            --dart-define=APP_ENV=production \
            --dart-define=ENABLE_MOCK_MODE=false \
            --dart-define="APP_VERSION=$SPRACHE_VERSION" \
            --dart-define="API_BASE_URL=$SPRACHE_API_BASE_URL" \
            --dart-define="PRIVACY_POLICY_URL=$SPRACHE_PRIVACY_POLICY_URL" \
            --dart-define="GOOGLE_ANDROID_CLIENT_ID=$SPRACHE_GOOGLE_ANDROID_CLIENT_ID" \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=$SPRACHE_GOOGLE_SERVER_CLIENT_ID"
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          artifact_dir="$RUNNER_TEMP/sprache-android-real-runtime"
          artifact_name="Sprache-Android-$SPRACHE_VERSION-google-debug-signed.apk"
          test -s "$source_apk"
          mkdir -p "$artifact_dir"
          cp "$source_apk" "$artifact_dir/$artifact_name"
          apksigner="$({
            find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
              -type f -name apksigner -print
          } | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs \
            "$artifact_dir/$artifact_name" \
            | tee "$artifact_dir/android-signing-certificate.txt"
          grep -Fq "CN=Android Debug" \
            "$artifact_dir/android-signing-certificate.txt"
      - name: Boot KVM emulator, install exact APK, and prove a rendered frame
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          emulator="$sdk_root/emulator/emulator"
          platform_tools="$sdk_root/platform-tools"
          artifact_dir="$RUNNER_TEMP/sprache-android-real-runtime"
          artifact_name="Sprache-Android-$SPRACHE_VERSION-google-debug-signed.apk"
          apk="$artifact_dir/$artifact_name"
          screenshot="$artifact_dir/runtime-android-first-frame.png"
          evidence="$artifact_dir/runtime-android.json"
          serial="emulator-5554"
          test -s "$apk"
          test -x "$emulator"
          test -x "$platform_tools/adb"
          export PATH="$platform_tools:$PATH"
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::GitHub runner does not expose /dev/kvm."
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

          "$emulator" \
            -avd SpracheCiApi35 \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-metrics \
            -no-snapshot \
            -wipe-data \
            -accel on \
            -gpu swiftshader_indirect \
            -verbose \
            > "$artifact_dir/android-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            timeout --kill-after=5s 30s adb -s "$serial" logcat -d \
              > "$artifact_dir/android-logcat.txt" 2>&1 || true
            timeout --kill-after=5s 30s adb -s "$serial" emu kill \
              >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
            wait "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          timeout --kill-after=5s 30s adb start-server
          device_ready=0
          for _ in $(seq 1 180); do
            if timeout --kill-after=2s 5s adb devices |
              grep -Eq "^${serial}[[:space:]]+device$"; then
              device_ready=1
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Android emulator exited before adb detected it."
              tail -n 200 "$artifact_dir/android-emulator.log"
              exit 1
            fi
            sleep 1
          done
          if (( device_ready != 1 )); then
            echo "::error::adb did not detect the Android emulator within 180 seconds."
            tail -n 200 "$artifact_dir/android-emulator.log"
            exit 1
          fi
          boot_completed=""
          for _ in $(seq 1 180); do
            boot_completed="$(
              timeout --kill-after=2s 10s \
                adb -s "$serial" shell getprop sys.boot_completed \
                2>/dev/null | tr -d '\r' || true
            )"
            if [[ "$boot_completed" == "1" ]]; then break; fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Android emulator exited before boot completed."
              tail -n 200 "$artifact_dir/android-emulator.log"
              exit 1
            fi
            sleep 1
          done
          if [[ "$boot_completed" != "1" ]]; then
            echo "::error::Android emulator did not finish booting within 180 seconds."
            exit 1
          fi
          timeout --kill-after=2s 20s \
            adb -s "$serial" shell input keyevent KEYCODE_WAKEUP
          timeout --kill-after=2s 20s \
            adb -s "$serial" shell wm dismiss-keyguard
          timeout --kill-after=2s 20s \
            adb -s "$serial" shell settings put global window_animation_scale 0
          timeout --kill-after=2s 20s \
            adb -s "$serial" shell settings put global transition_animation_scale 0
          timeout --kill-after=2s 20s \
            adb -s "$serial" shell settings put global animator_duration_scale 0

          timeout --kill-after=5s 60s \
            adb -s "$serial" uninstall "$SPRACHE_PACKAGE" \
            >/dev/null 2>&1 || true
          timeout --kill-after=10s 300s \
            adb -s "$serial" install -r "$apk"
          timeout --kill-after=5s 60s \
            adb -s "$serial" shell dumpsys package "$SPRACHE_PACKAGE" \
            > "$artifact_dir/android-package.txt"
          version_pattern="${SPRACHE_VERSION//./\\.}"
          package_pattern="${SPRACHE_PACKAGE//./\\.}"
          grep -Eq "versionCode=$SPRACHE_BUILD_NUMBER([[:space:]]|$)" \
            "$artifact_dir/android-package.txt"
          grep -Eq "versionName=$version_pattern([[:space:]]|$)" \
            "$artifact_dir/android-package.txt"

          timeout --kill-after=2s 30s \
            adb -s "$serial" shell am force-stop "$SPRACHE_PACKAGE"
          timeout --kill-after=2s 30s \
            adb -s "$serial" shell dumpsys gfxinfo "$SPRACHE_PACKAGE" reset \
              >/dev/null
          start_ms="$(date +%s%3N)"
          timeout --kill-after=5s 60s \
            adb -s "$serial" shell am start -W -S \
              -n "$SPRACHE_PACKAGE/.MainActivity" \
            | tee "$artifact_dir/android-launch.txt"
          grep -Fq "Status: ok" "$artifact_dir/android-launch.txt"

          first_frame_ms=""
          last_frame_count=0
          foreground=0
          for _ in $(seq 1 240); do
            activity_state="$(
              timeout --kill-after=2s 5s \
                adb -s "$serial" shell dumpsys activity activities \
                2>/dev/null | tr -d '\r' || true
            )"
            foreground=0
            if grep -Eq \
              "(mResumedActivity|topResumedActivity).*${package_pattern}" \
              <<< "$activity_state"; then
              foreground=1
            fi
            gfx_info="$(
              timeout --kill-after=2s 5s \
                adb -s "$serial" shell dumpsys gfxinfo "$SPRACHE_PACKAGE" \
                2>/dev/null | tr -d '\r' || true
            )"
            frame_count="$(
              sed -n 's/.*Total frames rendered:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
                <<< "$gfx_info" | head -n 1
            )"
            if [[ "$frame_count" =~ ^[0-9]+$ ]]; then
              last_frame_count="$frame_count"
            fi
            if (( foreground == 1 && last_frame_count > 0 )); then
              first_frame_ms="$(( $(date +%s%3N) - start_ms ))"
              break
            fi
            sleep 0.25
          done
          if [[ -z "$first_frame_ms" || "$first_frame_ms" -gt 60000 ]]; then
            echo "::error::No foreground rendered frame was proven; foreground=$foreground frames=$last_frame_count."
            exit 1
          fi

          timeout --kill-after=5s 30s \
            adb -s "$serial" exec-out screencap -p > "$screenshot"
          python3 - "$screenshot" <<'PY'
          import pathlib
          import struct
          import sys

          screenshot = pathlib.Path(sys.argv[1]).read_bytes()
          assert len(screenshot) >= 4096, "Android screenshot is unexpectedly small"
          assert screenshot.startswith(b"\x89PNG\r\n\x1a\n"), "Screenshot is not a PNG"
          width, height = struct.unpack(">II", screenshot[16:24])
          assert width > 0 and height > 0, "Screenshot dimensions are invalid"
          PY
          python3 - "$evidence" "$first_frame_ms" <<'PY'
          import datetime
          import json
          import pathlib
          import sys

          output = pathlib.Path(sys.argv[1])
          first_frame_ms = int(sys.argv[2])
          value = {
              "format": "sprache-runtime-evidence-v1",
              "platform": "android",
              "mode": "REAL",
              "version": "1.31.0",
              "buildNumber": 55,
              "launched": True,
              "firstFrameRendered": True,
              "firstFrameMillis": first_frame_ms,
              "probe": "native-runtime",
              "checkedAt": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
          }
          assert 0 <= value["firstFrameMillis"] <= 60000
          output.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
          PY
          python3 - "$evidence" <<'PY'
          import datetime
          import json
          import pathlib
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value["format"] == "sprache-runtime-evidence-v1"
          assert value["platform"] == "android"
          assert value["mode"] == "REAL"
          assert value["version"] == "1.31.0"
          assert value["buildNumber"] == 55
          assert value["launched"] is True
          assert value["firstFrameRendered"] is True
          assert 0 <= value["firstFrameMillis"] <= 60000
          assert value["probe"] == "native-runtime"
          datetime.datetime.fromisoformat(value["checkedAt"].replace("Z", "+00:00"))
          PY
          (
            cd "$artifact_dir"
            sha256sum "$artifact_name" > "$artifact_name.sha256"
            sha256sum --check "$artifact_name.sha256"
          )
      - name: Upload exact Android REAL runtime artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sprache-Android-1.31.0-real-runtime
          path: |
            ${{ runner.temp }}/sprache-android-real-runtime/Sprache-Android-1.31.0-google-debug-signed.apk
            ${{ runner.temp }}/sprache-android-real-runtime/Sprache-Android-1.31.0-google-debug-signed.apk.sha256
            ${{ runner.temp }}/sprache-android-real-runtime/runtime-android.json
            ${{ runner.temp }}/sprache-android-real-runtime/runtime-android-first-frame.png
            ${{ runner.temp }}/sprache-android-real-runtime/android-signing-certificate.txt
            ${{ runner.temp }}/sprache-android-real-runtime/android-package.txt
            ${{ runner.temp }}/sprache-android-real-runtime/android-launch.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android emulator diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sprache-Android-1.31.0-real-runtime-diagnostics
          path: |
            ${{ runner.temp }}/sprache-android-real-runtime/android-emulator.log
            ${{ runner.temp }}/sprache-android-real-runtime/android-logcat.txt
            ${{ runner.temp }}/sprache-android-real-runtime/android-signing-certificate.txt
            ${{ runner.temp }}/sprache-android-real-runtime/android-package.txt
            ${{ runner.temp }}/sprache-android-real-runtime/android-launch.txt
          if-no-files-found: warn
          retention-days: 7

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - uses: nuget/setup-nuget@v2
      - working-directory: apps/client
        run: flutter pub get
      - working-directory: apps/client
        run: >-
          flutter test
          test/visual
          test/qa/release_visual_semantics_matrix_test.dart
      - working-directory: apps/client
        run: >-
          flutter build windows --release
          --build-name=1.31.0
          --build-number=55
          --dart-define=ENABLE_MOCK_MODE=true
          --dart-define=APP_VERSION=1.31.0
      - name: Verify Windows release output
        working-directory: apps/client
        shell: pwsh
        run: |
          $required = @(
            'build\windows\x64\runner\Release\sprache.exe',
            'build\windows\x64\runner\Release\flutter_windows.dll',
            'build\windows\x64\runner\Release\data\flutter_assets\AssetManifest.bin'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing Windows release file: $path"
            }
          }
      - name: Package Windows CI artifact
        working-directory: apps/client
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'sprache-ci-artifacts'
          $artifactName = 'Sprache-1.31.0-ci-windows-x64-mock.zip'
          $artifactPath = Join-Path $artifactDirectory $artifactName
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          Compress-Archive `
            -Path 'build\windows\x64\runner\Release\*' `
            -DestinationPath $artifactPath `
            -CompressionLevel Optimal `
            -Force
          $hash = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $artifactName" | Set-Content -LiteralPath "$artifactPath.sha256" -Encoding utf8NoBOM
      - name: Upload Windows CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sprache-1.31.0-ci-windows-x64-mock
          path: |
            ${{ runner.temp }}/sprache-ci-artifacts/Sprache-1.31.0-ci-windows-x64-mock.zip
            ${{ runner.temp }}/sprache-ci-artifacts/Sprache-1.31.0-ci-windows-x64-mock.zip.sha256
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - working-directory: apps/client
        run: flutter pub get
      - name: Build unsigned iOS simulator app
        working-directory: apps/client
        run: >-
          flutter build ios --simulator --debug
          --build-name=1.31.0
          --build-number=55
          --dart-define=APP_ENV=ci
          --dart-define=ENABLE_MOCK_MODE=true
          --dart-define=APP_VERSION=1.31.0
          --dart-define=ENABLE_RELEASE_PROBE=true
          --dart-define=RELEASE_PROBE_MODE=MOCK
          --dart-define=RELEASE_BUILD_NUMBER=55
          --dart-define=RELEASE_PROBE_KIND=simulator-runtime
      - name: Verify iOS simulator output
        working-directory: apps/client
        shell: bash
        run: |
          app_path="build/ios/iphonesimulator/Runner.app"
          test -d "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" = "com.youkdonghun.sprache"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app_path/Info.plist")" = "Sprache"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app_path/Info.plist")" = "13.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")" = "1.31.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")" = "55"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app_path/Info.plist")" = "sprache"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes' "$app_path/Info.plist" |
            grep -q 'com.youkdonghun.sprache.json-lines'
      - name: Launch iOS Simulator and collect first-frame evidence
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/ios/iphonesimulator/Runner.app"
          artifact_dir="$RUNNER_TEMP/sprache-ci-artifacts"
          device_id="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ['xcrun', 'simctl', 'list', 'devices', 'available', '-j'],
                  text=True,
              )
          )
          for devices in payload['devices'].values():
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone Simulator was found')
          PY
          )"
          mkdir -p "$artifact_dir"
          printf '%s' "$device_id" > "$RUNNER_TEMP/sprache-ios-device-id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl uninstall "$device_id" com.youkdonghun.sprache 2>/dev/null || true
          xcrun simctl install "$device_id" "$app_path"
          xcrun simctl launch --terminate-running-process \
            "$device_id" com.youkdonghun.sprache
          data_container="$(
            xcrun simctl get_app_container \
              "$device_id" com.youkdonghun.sprache data
          )"
          marker=""
          # Keep the polling window aligned with the 60-second evidence budget.
          for _ in $(seq 1 120); do
            marker="$(
              find "$data_container/Library/Application Support" \
                -type f -name 'sprache-runtime-evidence-v1.json' \
                -print -quit 2>/dev/null || true
            )"
            if [[ -n "$marker" ]]; then break; fi
            sleep 0.5
          done
          test -n "$marker"
          python3 - "$marker" <<'PY'
          import json
          import pathlib
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value['format'] == 'sprache-runtime-evidence-v1'
          assert value['platform'] == 'ios'
          assert value['mode'] == 'MOCK'
          assert value['version'] == '1.31.0'
          assert value['buildNumber'] == 55
          assert value['launched'] is True
          assert value['firstFrameRendered'] is True
          assert value['probe'] == 'simulator-runtime'
          assert 0 <= value['firstFrameMillis'] <= 60000
          PY
          cp "$marker" "$artifact_dir/runtime-ios.json"
          xcrun simctl io "$device_id" screenshot \
            "$artifact_dir/runtime-ios-first-frame.png"
      - name: Package iOS simulator CI artifact
        working-directory: apps/client
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/sprache-ci-artifacts"
          artifact_name="Sprache-iOS-Simulator-1.31.0-mock.zip"
          mkdir -p "$artifact_dir"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            "$artifact_dir/$artifact_name"
          (
            cd "$artifact_dir"
            shasum -a 256 "$artifact_name" > "$artifact_name.sha256"
          )
      - name: Upload iOS simulator CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sprache-iOS-Simulator-1.31.0-mock
          path: |
            ${{ runner.temp }}/sprache-ci-artifacts/Sprache-iOS-Simulator-1.31.0-mock.zip
            ${{ runner.temp }}/sprache-ci-artifacts/Sprache-iOS-Simulator-1.31.0-mock.zip.sha256
            ${{ runner.temp }}/sprache-ci-artifacts/runtime-ios.json
            ${{ runner.temp }}/sprache-ci-artifacts/runtime-ios-first-frame.png
          if-no-files-found: error
          retention-days: 14
      - name: Shut down iOS Simulator
        if: always()
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/sprache-ios-device-id" ]]; then
            xcrun simctl shutdown \
              "$(cat "$RUNNER_TEMP/sprache-ios-device-id")" 2>/dev/null || true
          fi

  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - working-directory: apps/client
        run: flutter pub get
      - name: Build macOS release app for CI validation
        working-directory: apps/client
        run: >-
          flutter build macos --release
          --build-name=1.31.0
          --build-number=55
          --dart-define=APP_ENV=ci
          --dart-define=ENABLE_MOCK_MODE=true
          --dart-define=APP_VERSION=1.31.0
          --dart-define=ENABLE_RELEASE_PROBE=true
          --dart-define=RELEASE_PROBE_MODE=MOCK
          --dart-define=RELEASE_BUILD_NUMBER=55
          --dart-define=RELEASE_PROBE_KIND=native-runtime
      - name: Verify macOS release output
        working-directory: apps/client
        shell: bash
        run: |
          app_path="build/macos/Build/Products/Release/Sprache.app"
          ci_entitlements="$RUNNER_TEMP/sprache-macos-ci.entitlements"
          test -d "$app_path"
          test -x "$app_path/Contents/MacOS/Sprache"
          test -f "$app_path/Contents/Info.plist"
          cp macos/Runner/Release.entitlements "$ci_entitlements"
          /usr/libexec/PlistBuddy -c 'Delete :keychain-access-groups' \
            "$ci_entitlements"
          codesign --force --deep --sign - "$app_path"
          codesign --force --sign - --entitlements "$ci_entitlements" \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")"
          bundle_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app_path/Contents/Info.plist")"
          minimum_version="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app_path/Contents/Info.plist")"
          short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")"
          build_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Contents/Info.plist")"
          test "$bundle_id" = "com.youkdonghun.sprache"
          test "$bundle_name" = "Sprache"
          test "$minimum_version" = "12.0"
          test "$short_version" = "1.31.0"
          test "$build_version" = "55"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app_path/Contents/Info.plist")" = "sprache"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes' "$app_path/Contents/Info.plist" |
            grep -q 'com.youkdonghun.sprache.json-lines'
      - name: Launch macOS app and collect first-frame evidence
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/macos/Build/Products/Release/Sprache.app"
          artifact_dir="$RUNNER_TEMP/sprache-ci-artifacts"
          runtime_log="$RUNNER_TEMP/sprache-macos-runtime.log"
          mkdir -p "$artifact_dir"
          /usr/bin/open -W -n "$app_path" >"$runtime_log" 2>&1 &
          launcher_pid=$!
          app_pid=""
          cleanup() {
            if [[ -n "$app_pid" ]]; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
            kill "$launcher_pid" 2>/dev/null || true
            wait "$launcher_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          marker=""
          # Keep the polling window aligned with the 60-second evidence budget.
          for _ in $(seq 1 120); do
            if ! kill -0 "$launcher_pid" 2>/dev/null; then
              cat "$runtime_log" || true
              exit 1
            fi
            app_pid="$(pgrep -x Sprache 2>/dev/null | tail -n 1 || true)"
            marker="$(
              find \
                "$HOME/Library/Containers/com.youkdonghun.sprache/Data/Library/Application Support" \
                "$HOME/Library/Application Support" \
                -type f -name 'sprache-runtime-evidence-v1.json' \
                -print -quit 2>/dev/null || true
            )"
            if [[ -n "$marker" ]]; then break; fi
            sleep 0.5
          done
          test -n "$app_pid"
          kill -0 "$app_pid"
          test -n "$marker"
          python3 - "$marker" <<'PY'
          import json
          import pathlib
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value['format'] == 'sprache-runtime-evidence-v1'
          assert value['platform'] == 'macos'
          assert value['mode'] == 'MOCK'
          assert value['version'] == '1.31.0'
          assert value['buildNumber'] == 55
          assert value['launched'] is True
          assert value['firstFrameRendered'] is True
          assert value['probe'] == 'native-runtime'
          assert 0 <= value['firstFrameMillis'] <= 60000
          PY
          cp "$marker" "$artifact_dir/runtime-macos.json"
      - name: Package macOS CI artifact
        working-directory: apps/client
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/sprache-ci-artifacts"
          artifact_name="Sprache-macOS-1.31.0-mock.zip"
          mkdir -p "$artifact_dir"
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Sprache.app \
            "$artifact_dir/$artifact_name"
          (
            cd "$artifact_dir"
            shasum -a 256 "$artifact_name" > "$artifact_name.sha256"
          )
      - name: Upload macOS CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sprache-macOS-1.31.0-mock
          path: |
            ${{ runner.temp }}/sprache-ci-artifacts/Sprache-macOS-1.31.0-mock.zip
            ${{ runner.temp }}/sprache-ci-artifacts/Sprache-macOS-1.31.0-mock.zip.sha256
            ${{ runner.temp }}/sprache-ci-artifacts/runtime-macos.json
          if-no-files-found: error
          retention-days: 14
