name: Update language-pack catalog

on:
  push:
    branches: [main]
    paths:
      - "language-packs/packs/*.json"
      - "language-packs/sources/**"
      - "apps/client/tool/export_bundled_word_index.dart"
      - "tool/refresh-language-packs.mjs"
      - "tool/build-language-pack-catalog.mjs"
      - "tool/test/language-pack-catalog.test.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: language-pack-catalog-main
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
      - name: Validate packs and rebuild the catalog
        run: |
          set -euo pipefail
          dart --version
          cd apps/client
          flutter pub get
          dart run tool/export_bundled_word_index.dart --check
          cd ../..
          node ./tool/refresh-language-packs.mjs --check
          node ./tool/build-language-pack-catalog.mjs
          node --test ./tool/test/language-pack-catalog.test.mjs
      - name: Commit a changed catalog
        shell: bash
        run: |
          set -euo pipefail
          git add language-packs/catalog.json
          if git diff --cached --quiet; then
            echo "Language-pack catalog is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: 언어팩 카탈로그 갱신"
          git push origin HEAD:main
