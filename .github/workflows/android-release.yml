name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_ANDROID_CLIENT_ID: 1054343487948-v3u90fo5nmbrk4hn7ss2gnrg601phkuv.apps.googleusercontent.com
      GOOGLE_SERVER_CLIENT_ID: 1054343487948-g6b3fp20ooq86agro7nsb129oqr9df82.apps.googleusercontent.com
      EXPECTED_CERTIFICATE_SHA256: 0d9cfd91413f00145a9e5dbff64056a647a5f0f51736323aebfe44a5378b4e68
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Read and verify the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(grep -E '^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' apps/client/pubspec.yaml)"
          version="${version_line#version: }"
          build_number="${version##*+}"
          version="${version%%+*}"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec $tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore the existing Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SPRACHE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sprache-release.keystore"
          chmod 600 "$RUNNER_TEMP/sprache-release.keystore"
          test -s "$RUNNER_TEMP/sprache-release.keystore"

      - name: Verify updater and pronunciation behavior
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test \
            test/services/release_update_service_test.dart \
            test/widget/release_update_card_test.dart \
            test/services/tts_service_test.dart
          flutter test test/widget/library_multiview_workflow_test.dart \
            --plain-name "mobile details move to the previous and next filtered item"

      - name: Build the production Android APK
        working-directory: apps/client
        shell: bash
        env:
          SPRACHE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sprache-release.keystore
          SPRACHE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SPRACHE_ANDROID_KEYSTORE_PASSWORD }}
          SPRACHE_ANDROID_KEY_ALIAS: ${{ secrets.SPRACHE_ANDROID_KEY_ALIAS }}
          SPRACHE_ANDROID_KEY_PASSWORD: ${{ secrets.SPRACHE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --dart-define=APP_ENV=production \
            --dart-define=ENABLE_MOCK_MODE=false \
            --dart-define="APP_VERSION=${{ steps.version.outputs.version }}" \
            --dart-define="RELEASE_BUILD_NUMBER=${{ steps.version.outputs.build_number }}" \
            --dart-define=PRIVACY_POLICY_URL=https://sprache6.github.io/privacy/ \
            --dart-define="GOOGLE_ANDROID_CLIENT_ID=$GOOGLE_ANDROID_CLIENT_ID" \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"

      - name: Verify signing and prepare release metadata
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          build_number="${{ steps.version.outputs.build_number }}"
          source_apk="apps/client/build/app/outputs/flutter-apk/app-release.apk"
          release_dir="$RUNNER_TEMP/sprache-release"
          apk_name="Sprache-Android-$version-google-debug-signed.apk"
          apk="$release_dir/$apk_name"
          mkdir -p "$release_dir"
          test -s "$source_apk"
          cp "$source_apk" "$apk"
          apksigner="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "::error::Android apksigner was not found on the runner."
            exit 1
          fi
          signing_output="$($apksigner verify --verbose --print-certs "$apk")"
          certificate_sha256="$(printf '%s\n' "$signing_output" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d '\r')"
          if [[ -z "$certificate_sha256" ]]; then
            echo "::error::The APK signing certificate fingerprint could not be read."
            printf '%s\n' "$signing_output"
            exit 1
          fi
          if [[ "$certificate_sha256" != "$EXPECTED_CERTIFICATE_SHA256" ]]; then
            echo "::error::The APK was signed by an unexpected certificate: $certificate_sha256"
            exit 1
          fi
          sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          size_bytes="$(stat -c '%s' "$apk")"
          printf '%s  %s\n' "$sha256" "$apk_name" > "$release_dir/$apk_name.sha256"
          python3 - "$release_dir/release.json" "$version" "$build_number" "$apk_name" "$sha256" "$size_bytes" <<'PY'
          import datetime
          import json
          import pathlib
          import sys

          output, version, build_number, apk_name, sha256, size_bytes = sys.argv[1:]
          release_page = f"https://github.com/youkdonghun/Sprache/releases/tag/v{version}"
          manifest = {
              "schemaVersion": 1,
              "version": version,
              "buildNumber": int(build_number),
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "title": f"Sprache {version}",
              "notes": [
                  "학습 설정은 방식·자료·문제 수만 고르면 바로 시작할 수 있고 세부 조건은 필요할 때만 펼칩니다.",
                  "앱을 다시 열면 새 버전을 한 번 확인하며, 설정과 안내창에서 최신 Android APK 링크를 공유할 수 있습니다.",
                  "자료실 상단을 추가·표로 수정·더보기로 정리하고 기본 제공 자료도 표에서 함께 편집할 수 있습니다.",
                  "여섯 학습 언어의 기본 문장을 언어별 100개로 늘리고 읽기와 문장 배열 정보를 함께 보강했습니다.",
              ],
              "releasePageUrl": release_page,
              "artifacts": {
                  "android": {
                      "kind": "apk",
                      "url": f"https://github.com/youkdonghun/Sprache/releases/download/v{version}/{apk_name}",
                      "fileName": apk_name,
                      "sha256": sha256,
                      "sizeBytes": int(size_bytes),
                  },
                  "windows": {"kind": "releasePage", "url": release_page},
                  "pwa": {"kind": "web", "url": "https://sprache6.github.io/app/"},
                  "macos": {"kind": "releasePage", "url": release_page},
                  "ios": {"kind": "releasePage", "url": release_page},
              },
          }
          pathlib.Path(output).write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Publish the APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          release_dir="${{ steps.artifact.outputs.release_dir }}"
          apk_name="${{ steps.artifact.outputs.apk_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace published files." >&2
            exit 1
          fi
          gh release create "$tag" \
            "$release_dir/$apk_name" \
            "$release_dir/$apk_name.sha256" \
            "$release_dir/release.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Sprache ${{ steps.version.outputs.version }}" \
            --notes "학습 설정은 기본 3단계만 먼저 보여주고 세부 조건은 필요할 때 펼치도록 간소화했습니다. 앱 시작 시 새 버전을 한 번 확인하며, 설정과 업데이트 안내에서 최신 Android APK 링크를 공유할 수 있습니다. 자료실은 추가·표로 수정·더보기 3개 동선으로 정리했고, 여섯 언어의 기본 문장을 언어별 100개로 늘렸습니다."
