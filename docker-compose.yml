services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sprache
      POSTGRES_USER: sprache
      POSTGRES_PASSWORD: sprache
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprache -d sprache"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sprache-postgres:/var/lib/postgresql/data

volumes:
  sprache-postgres:

